<router-outlet></router-outlet>

@if (toast.active(); as active) {
    <div
        role="status"
        aria-live="polite"
        class="fixed bottom-6 right-6 z-[10000] max-w-[320px] rounded-[11px] px-4 py-3 text-[13px] font-semibold shadow-[0_18px_40px_-16px_rgba(0,0,0,0.6)]"
        [class]="toastStyles[active.type]"
    >
        {{ active.message }}
    </div>
}
